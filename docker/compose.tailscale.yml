services:
  tailscale:
    image: docker.io/tailscale/tailscale:stable
    env_file:
      - ./environment/tailscale.env
      - ./environment/${STAGE}/tailscale.env
    volumes:
      - ./storage/tailscale/tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    healthcheck:
      test: 'tailscale status --active'
