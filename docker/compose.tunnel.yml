services:
  tunnel:
    image: cloudflare/cloudflared:latest
    command: 'tunnel --metrics=127.0.0.1:2000 run'
    env_file:
      - ./environment/tunnel.env
      - ./environment/${STAGE}/tunnel.env
    network_mode: container:tailscale
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics=127.0.0.1:2000', 'ready']
