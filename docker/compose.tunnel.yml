services:
  tunnel:
    image: cloudflare/cloudflared:latest
    command: 'tunnel --metrics=127.0.0.1:2000 run'
    env_file:
      - ./environment/tunnel.default.env
      - ./environment/tunnel.${STAGE:-default}.env
      - ./storage/secret/tunnel.default.env
      - ./storage/secret/tunnel.${STAGE:-default}.env
    network_mode: container:tailscale
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics=127.0.0.1:2000', 'ready']
