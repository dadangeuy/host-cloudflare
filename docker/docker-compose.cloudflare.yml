services:
  cloudflare:
    image: cloudflare/cloudflared:latest
    command: 'tunnel --metrics=127.0.0.1:2000 run'
    env_file:
      - ./environment/cloudflare.env
      - ./environment/${STAGE}/cloudflare.env
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics=127.0.0.1:2000', 'ready']
