services:
  nginx:
    image: docker.io/nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./file/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./file/nginx/internal.crt:/etc/ssl/certs/internal.crt
      - ./file/nginx/internal.key:/etc/ssl/private/internal.key
      - ./file/nginx/sitemap.xml:/usr/share/nginx/html/sitemap.xml
      - ./file/nginx/robots.txt:/usr/share/nginx/html/robots.txt
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: 'curl --fail --insecure https://localhost/health'